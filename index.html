<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>連點大對決 - 玩家 VS 電腦</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti for Victory Celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+TC:wght@500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            touch-action: manipulation;
        }

        .font-game {
            font-family: 'Fredoka One', 'Noto Sans TC', cursive;
        }

        /* 點擊按鈕脈衝動畫 */
        .click-btn {
            transition: transform 0.05s ease, box-shadow 0.05s ease;
            user-select: none;
            -webkit-user-select: none;
        }
        .click-btn:active {
            transform: scale(0.92);
        }

        /* 浮動數字動畫 */
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -120px) scale(1.5);
            }
        }
        .click-number {
            position: absolute;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            font-family: 'Fredoka One', sans-serif;
            font-weight: bold;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        /* 進度條光澤動畫 */
        .progress-glow {
            box-shadow: 0 0 15px currentColor;
        }

        /* 水波紋效果 */
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-effect 0.4s linear;
            background-color: rgba(255, 255, 255, 0.4);
            pointer-events: none;
        }
        @keyframes ripple-effect {
            to {
                transform: scale(2.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="min-h-screen text-white flex flex-col items-center justify-between p-4 overflow-x-hidden">

    <!-- 頂部標題區 -->
    <header class="w-full max-w-xl text-center my-2">
        <h1 class="text-3xl md:text-4xl font-black font-game tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-amber-400 via-pink-500 to-cyan-400 drop-shadow">
            ⚡ 30秒連點大對決 ⚡
        </h1>
        <p class="text-slate-300 text-xs md:text-sm mt-1">挑戰極速手速！你能擊敗每秒 5 下的電腦 AI 嗎？</p>
    </header>

    <!-- 主要遊戲內容區 -->
    <main class="w-full max-w-xl bg-slate-900/80 backdrop-blur-md rounded-3xl p-4 md:p-6 shadow-2xl border border-slate-700/50 flex flex-col gap-5 my-auto">

        <!-- 倒數計時與狀態列 -->
        <div class="flex justify-between items-center bg-slate-800/90 rounded-2xl p-4 border border-slate-700">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-amber-500/20 border border-amber-500/50 flex items-center justify-center text-amber-400 text-2xl">
                    <i class="fa-solid fa-stopwatch"></i>
                </div>
                <div>
                    <div class="text-xs text-slate-400 font-bold uppercase tracking-wider">剩餘時間</div>
                    <div id="timer" class="text-3xl font-black font-game text-amber-400">30.0 <span class="text-xs">s</span></div>
                </div>
            </div>

            <!-- 音效與遊戲狀態標籤 -->
            <div class="flex flex-col items-end gap-1">
                <span id="status-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                    準備好了嗎？
                </span>
                <span id="combo-rank" class="text-xs font-bold text-pink-400 h-4"></span>
            </div>
        </div>

        <!-- 雙方對決進度條 -->
        <div class="space-y-4 bg-slate-950/60 p-4 rounded-2xl border border-slate-800">
            
            <!-- 玩家進度 -->
            <div>
                <div class="flex justify-between text-sm font-bold mb-1">
                    <span class="text-cyan-400 flex items-center gap-2">
                        <i class="fa-solid fa-user-astronaut"></i> 玩家 (你)
                    </span>
                    <span class="text-cyan-300 font-game text-base">
                        <span id="player-clicks">0</span> 次 
                        <span class="text-xs text-slate-400 font-normal">(CPS: <span id="player-cps">0.0</span>)</span>
                    </span>
                </div>
                <div class="w-full bg-slate-800 h-5 rounded-full overflow-hidden p-0.5 border border-cyan-500/30">
                    <div id="player-bar" class="bg-gradient-to-r from-cyan-500 to-blue-500 h-full rounded-full transition-all duration-100 ease-out progress-glow text-cyan-400" style="width: 0%"></div>
                </div>
            </div>

            <!-- 電腦 AI 進度 -->
            <div>
                <div class="flex justify-between text-sm font-bold mb-1">
                    <span class="text-rose-400 flex items-center gap-2">
                        <i class="fa-solid fa-robot"></i> 電腦 AI <span class="text-[10px] bg-rose-500/20 text-rose-300 px-1.5 py-0.5 rounded border border-rose-500/30">5下/秒</span>
                    </span>
                    <span class="text-rose-300 font-game text-base">
                        <span id="ai-clicks">0</span> 次 
                        <span class="text-xs text-slate-400 font-normal">(CPS: <span id="ai-cps">0.0</span>)</span>
                    </span>
                </div>
                <div class="w-full bg-slate-800 h-5 rounded-full overflow-hidden p-0.5 border border-rose-500/30">
                    <div id="ai-bar" class="bg-gradient-to-r from-rose-500 to-purple-600 h-full rounded-full transition-all duration-75 ease-out progress-glow text-rose-400" style="width: 0%"></div>
                </div>
            </div>

        </div>

        <!-- 連點按鈕區域 -->
        <div class="relative w-full aspect-[4/3] max-h-[280px] flex items-center justify-center">
            
            <!-- 點擊區域 -->
            <button id="click-btn" class="click-btn relative w-full h-full rounded-3xl bg-gradient-to-b from-cyan-400 via-blue-600 to-indigo-800 p-1 shadow-[0_10px_0_0_#1e1b4b,0_15px_25px_rgba(0,0,0,0.5)] border-4 border-cyan-300/40 flex flex-col items-center justify-center gap-2 cursor-pointer overflow-hidden group">
                
                <!-- 內層光暈背景 -->
                <div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>

                <div class="w-20 h-20 md:w-24 md:h-24 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center border border-white/30 text-white text-4xl md:text-5xl shadow-inner group-active:scale-90 transition-transform">
                    <i class="fa-solid fa-hand-pointer animate-bounce"></i>
                </div>
                <span class="text-xl md:text-2xl font-black font-game text-white tracking-wide drop-shadow-md">
                    瘋狂點擊這裡！
                </span>
                <span class="text-xs text-cyan-100/80 font-medium">
                    (30秒內點擊越快越好)
                </span>
            </button>
            
            <!-- 開始提示浮層 (遊戲尚未開始時顯示) -->
            <div id="start-overlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm rounded-3xl flex flex-col items-center justify-center p-6 text-center z-10 border border-slate-700">
                <i class="fa-solid fa-bolt text-5xl text-amber-400 mb-3 animate-pulse"></i>
                <h2 class="text-2xl font-bold font-game mb-1">準備好手速了嗎？</h2>
                <p class="text-slate-300 text-sm mb-6">點擊下方按鈕開始對決！電腦將以平均每秒 5 下的速度推進！</p>
                <button id="start-btn" class="px-8 py-3 bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-300 hover:to-teal-400 text-slate-950 font-black font-game text-lg rounded-2xl shadow-lg shadow-emerald-500/30 transform active:scale-95 transition-all">
                    🚀 開始比賽！
                </button>
            </div>
        </div>

    </main>

    <!-- 頁尾宣告 -->
    <footer class="text-slate-500 text-xs text-center my-2">
        30 Seconds Speed Clicker Game &copy; HTML5 / TailwindCSS / JS
    </footer>

    <!-- 結算彈窗 Modal -->
    <div id="result-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl text-center transform scale-90 transition-transform duration-300" id="modal-card">
            
            <!-- 結果圖示 -->
            <div id="result-icon-container" class="w-20 h-20 rounded-2xl mx-auto flex items-center justify-center text-4xl mb-4 shadow-lg">
                <i id="result-icon" class="fa-solid fa-trophy"></i>
            </div>

            <h2 id="result-title" class="text-3xl font-black font-game mb-1">勝利！</h2>
            <p id="result-subtitle" class="text-slate-400 text-sm mb-6">你成功的壓制了電腦對手！</p>

            <!-- 詳細數據對比表 -->
            <div class="bg-slate-950/70 rounded-2xl p-4 border border-slate-800 space-y-3 mb-6 text-left">
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                    <span class="text-slate-400 text-sm">你的總點擊數</span>
                    <span id="res-player-clicks" class="text-cyan-400 font-game text-lg">0 次</span>
                </div>
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                    <span class="text-slate-400 text-sm">電腦總點擊數</span>
                    <span id="res-ai-clicks" class="text-rose-400 font-game text-lg">0 次</span>
                </div>
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                    <span class="text-slate-400 text-sm">勝負差距</span>
                    <span id="res-diff" class="text-amber-400 font-game text-lg">+0 次</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-400 text-sm">你的平均手速 (CPS)</span>
                    <span id="res-cps" class="text-emerald-400 font-game text-lg">0.0 下/秒</span>
                </div>
            </div>

            <!-- 再玩一次按鈕 -->
            <button id="restart-btn" class="w-full py-3.5 bg-gradient-to-r from-cyan-400 to-blue-500 hover:from-cyan-300 hover:to-blue-400 text-slate-950 font-black font-game text-lg rounded-2xl shadow-lg shadow-cyan-500/25 active:scale-95 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate-right"></i> 再戰一局！
            </button>
        </div>
    </div>

    <!-- 遊戲邏輯 JavaScript -->
    <script>
        // 遊戲設定
        const GAME_DURATION = 30.0; // 30 秒
        const AI_TARGET_CPS = 5.0;  // 電腦每秒平均點擊 5 下

        // 遊戲狀態變數
        let timeLeft = GAME_DURATION;
        let playerClicks = 0;
        let aiClicks = 0;
        let isGameRunning = false;
        let gameTimer = null;
        let aiTimer = null;
        let startTime = 0;

        // DOM 元素引用
        const timerEl = document.getElementById('timer');
        const playerClicksEl = document.getElementById('player-clicks');
        const aiClicksEl = document.getElementById('ai-clicks');
        const playerCpsEl = document.getElementById('player-cps');
        const aiCpsEl = document.getElementById('ai-cps');
        const playerBar = document.getElementById('player-bar');
        const aiBar = document.getElementById('ai-bar');
        const clickBtn = document.getElementById('click-btn');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const startOverlay = document.getElementById('start-overlay');
        const statusBadge = document.getElementById('status-badge');
        const comboRank = document.getElementById('combo-rank');

        // Modal 元素
        const resultModal = document.getElementById('result-modal');
        const modalCard = document.getElementById('modal-card');
        const resultIconContainer = document.getElementById('result-icon-container');
        const resultIcon = document.getElementById('result-icon');
        const resultTitle = document.getElementById('result-title');
        const resultSubtitle = document.getElementById('result-subtitle');
        const resPlayerClicks = document.getElementById('res-player-clicks');
        const resAiClicks = document.getElementById('res-ai-clicks');
        const resDiff = document.getElementById('res-diff');
        const resCps = document.getElementById('res-cps');

        // 音效 (Web Audio API 合成音效，無需外部檔案)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(freq, type = 'sine', duration = 0.08) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                // 忽略聲音無法播放的問題
            }
        }

        // 開始遊戲
        function startGame() {
            if (isGameRunning) return;

            // 重置狀態
            timeLeft = GAME_DURATION;
            playerClicks = 0;
            aiClicks = 0;
            isGameRunning = true;
            startTime = Date.now();

            // 更新 UI 初始狀態
            updateUI();
            startOverlay.classList.add('hidden');
            statusBadge.textContent = '對決進行中！';
            statusBadge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30 animate-pulse';

            // 啟動倒數計時器 (每 50ms 更新一次時間)
            gameTimer = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                timeLeft = Math.max(0, GAME_DURATION - elapsed);
                
                timerEl.innerHTML = `${timeLeft.toFixed(1)} <span class="text-xs">s</span>`;
                updateCPS();

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 50);

            // 啟動 AI 點擊模擬器
            scheduleAIClick();
        }

        // 電腦 AI 點擊邏輯 (每秒平均 5 下，帶微小隨機波動更加真實)
        function scheduleAIClick() {
            if (!isGameRunning) return;

            // 每秒 5 下平均間隔 200ms，加入 ±40ms 隨機波動
            const baseInterval = 1000 / AI_TARGET_CPS; // 200ms
            const jitter = (Math.random() - 0.5) * 80; 
            const nextDelay = Math.max(50, baseInterval + jitter);

            aiTimer = setTimeout(() => {
                if (isGameRunning) {
                    aiClicks++;
                    updateUI();
                    scheduleAIClick();
                }
            }, nextDelay);
        }

        // 玩家點擊處理
        function handlePlayerClick(e) {
            if (!isGameRunning) return;

            playerClicks++;
            playSound(300 + Math.min(playerClicks * 2, 400), 'triangle');
            
            // 產生點擊波紋與浮動數字效果
            createClickEffect(e);
            
            updateUI();
        }

        // 產生視覺點擊效果
        function createClickEffect(e) {
            const rect = clickBtn.getBoundingClientRect();
            
            // 計算點擊位置相對座標
            let x, y;
            if (e.touches && e.touches.length > 0) {
                x = e.touches[0].clientX - rect.left;
                y = e.touches[0].clientY - rect.top;
            } else {
                x = e.clientX - rect.left;
                y = e.clientY - rect.top;
            }

            // 浮動數字 (+1)
            const numEl = document.createElement('div');
            numEl.className = 'click-number text-cyan-300 text-2xl font-black';
            numEl.textContent = '+1';
            numEl.style.left = `${x}px`;
            numEl.style.top = `${y}px`;
            clickBtn.appendChild(numEl);

            // 移除元素動畫結束後
            setTimeout(() => numEl.remove(), 600);

            // 水波紋
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = `${size}px`;
            ripple.style.left = `${x - size / 2}px`;
            ripple.style.top = `${y - size / 2}px`;
            clickBtn.appendChild(ripple);

            setTimeout(() => ripple.remove(), 400);
        }

        // 計算並更新每秒平均點擊數 (CPS)
        function updateCPS() {
            const elapsed = Math.max(0.1, (Date.now() - startTime) / 1000);
            const pCPS = (playerClicks / elapsed).toFixed(1);
            const aCPS = (aiClicks / elapsed).toFixed(1);

            playerCpsEl.textContent = pCPS;
            aiCpsEl.textContent = aCPS;

            // 根據玩家手速顯示稱號
            if (pCPS >= 10) {
                comboRank.textContent = '🔥 超神手速 (GODLIKE!)';
                comboRank.className = 'text-xs font-bold text-amber-400 animate-bounce';
            } else if (pCPS >= 7) {
                comboRank.textContent = '⚡ 瘋狂連點 (INSANE)';
                comboRank.className = 'text-xs font-bold text-pink-400';
            } else if (pCPS >= 5) {
                comboRank.textContent = '🚀 快速推進 (RAPID)';
                comboRank.className = 'text-xs font-bold text-cyan-400';
            } else {
                comboRank.textContent = '';
            }
        }

        // 更新介面進度與數據
        function updateUI() {
            playerClicksEl.textContent = playerClicks;
            aiClicksEl.textContent = aiClicks;

            // 計算進度條比例 (以兩者最大值或預估最大值做基準)
            const maxVal = Math.max(playerClicks, aiClicks, 150); 
            const playerPercent = Math.min(100, (playerClicks / maxVal) * 100);
            const aiPercent = Math.min(100, (aiClicks / maxVal) * 100);

            playerBar.style.width = `${playerPercent}%`;
            aiBar.style.width = `${aiPercent}%`;
        }

        // 結束遊戲並結算
        function endGame() {
            isGameRunning = false;
            clearInterval(gameTimer);
            clearTimeout(aiTimer);

            statusBadge.textContent = '比賽結束！';
            statusBadge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-slate-700 text-slate-300';

            const diff = playerClicks - aiClicks;
            const finalCPS = (playerClicks / GAME_DURATION).toFixed(1);

            resPlayerClicks.textContent = `${playerClicks} 次`;
            resAiClicks.textContent = `${aiClicks} 次`;
            resCps.textContent = `${finalCPS} 下/秒`;

            if (diff > 0) {
                // 玩家獲勝
                resDiff.textContent = `+${diff} 次`;
                resDiff.className = 'text-emerald-400 font-game text-lg';
                resultTitle.textContent = '🎉 你贏了！';
                resultSubtitle.textContent = `太厲害了！你以 ${diff} 下的優勢壓制了電腦！`;
                resultIconContainer.className = 'w-20 h-20 rounded-2xl mx-auto flex items-center justify-center text-4xl mb-4 shadow-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
                resultIcon.className = 'fa-solid fa-trophy';
                playSound(600, 'sine', 0.2);
                setTimeout(() => playSound(800, 'sine', 0.4), 200);

                // 慶祝煙火動畫
                try {
                    confetti({
                        particleCount: 100,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                } catch(e){}

            } else if (diff < 0) {
                // 電腦獲勝
                resDiff.textContent = `${diff} 次`;
                resDiff.className = 'text-rose-400 font-game text-lg';
                resultTitle.textContent = '❌ 殘念敗北！';
                resultSubtitle.textContent = `電腦以 ${Math.abs(diff)} 下險勝！再試一次挑戰它！`;
                resultIconContainer.className = 'w-20 h-20 rounded-2xl mx-auto flex items-center justify-center text-4xl mb-4 shadow-lg bg-rose-500/20 text-rose-400 border border-rose-500/30';
                resultIcon.className = 'fa-solid fa-robot';
                playSound(200, 'sawtooth', 0.3);

            } else {
                // 平手
                resDiff.textContent = '0 次 (平手)';
                resDiff.className = 'text-amber-400 font-game text-lg';
                resultTitle.textContent = '🤝 旗鼓相當！';
                resultSubtitle.textContent = '你的速度與電腦完全一致！真是不可思議！';
                resultIconContainer.className = 'w-20 h-20 rounded-2xl mx-auto flex items-center justify-center text-4xl mb-4 shadow-lg bg-amber-500/20 text-amber-400 border border-amber-500/30';
                resultIcon.className = 'fa-solid fa-handshake';
            }

            // 顯示彈窗動畫
            showModal();
        }

        // 顯示結算彈窗
        function showModal() {
            resultModal.classList.remove('hidden');
            setTimeout(() => {
                resultModal.classList.remove('opacity-0');
                modalCard.classList.remove('scale-90');
                modalCard.classList.add('scale-100');
            }, 10);
        }

        // 隱藏結算彈窗
        function hideModal() {
            resultModal.classList.add('opacity-0');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-90');
            setTimeout(() => {
                resultModal.classList.add('hidden');
            }, 300);
        }

        // 重置並重新開始
        function resetGame() {
            hideModal();
            startOverlay.classList.remove('hidden');
            playerClicks = 0;
            aiClicks = 0;
            timeLeft = GAME_DURATION;
            timerEl.innerHTML = `30.0 <span class="text-xs">s</span>`;
            playerCpsEl.textContent = '0.0';
            aiCpsEl.textContent = '0.0';
            comboRank.textContent = '';
            updateUI();
        }

        // 事件監聽綁定
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', resetGame);

        // 防範觸控雙擊縮放問題並支援多點觸控點擊
        clickBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            handlePlayerClick(e);
        });

        // 支援鍵盤空白鍵連點
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && isGameRunning) {
                e.preventDefault();
                const rect = clickBtn.getBoundingClientRect();
                const fakeEvent = {
                    clientX: rect.left + rect.width / 2,
                    clientY: rect.top + rect.height / 2
                };
                handlePlayerClick(fakeEvent);
            }
        });
    </script>
</body>
</html>
